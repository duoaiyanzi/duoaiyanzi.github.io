<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>小燕子专线</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap" media="print" onload="this.media='all'">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* 布局：单列聊天窗。顶部一根电线，燕子蹲在线上；开场是一封航空信，拆开才接通专线 */
:root{
  --sky:#e8eff7; --sky-hi:#f4f8fc; --ink:#1c2642; --ink-soft:#5a6684;
  --throat:#d6463a; --throat-ink:#ffffff; --belly:#ffffff; --line:#cdd8e6; --wire:#8d99b4;
  --paper:#fbfcff; --paper-2:#e9eff8; --air:#2f5fae; --shadow:rgba(28,38,66,.16); --scrim:rgba(12,18,36,.42);
  --r-n:#5f6a84; --r-r:#2563b0; --r-sr:#6545b8; --r-ssr:#94680d;
  --ok:#2fb36a; --warn:#e0a325;
  --f-display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","PingFang SC",serif;
  --f-letter:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0e1426; --sky-hi:#141c33; --ink:#e7ecf6; --ink-soft:#97a3c0;
    --throat:#ee6553; --throat-ink:#ffffff; --belly:#1a2340; --line:#2a365c; --wire:#5d6a8c;
    --paper:#1b2544; --paper-2:#243058; --air:#6f9be6; --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
    --ok:#45c97f; --warn:#f0b840;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#0e1426; --sky-hi:#141c33; --ink:#e7ecf6; --ink-soft:#97a3c0;
  --throat:#ee6553; --throat-ink:#ffffff; --belly:#1a2340; --line:#2a365c; --wire:#5d6a8c;
  --paper:#1b2544; --paper-2:#243058; --air:#6f9be6; --shadow:rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55);
  --ok:#45c97f; --warn:#f0b840;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--throat);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 顶栏 ---------- */
header{position:relative;padding-block:12px 26px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand{min-width:0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.04em;line-height:1.15;user-select:none;-webkit-user-select:none}
.status{margin-top:3px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--wire);flex:none}
.status[data-mode="api"] .dot,.status[data-mode="claude"] .dot{background:var(--ok)}
.status[data-mode="local"] .dot{background:var(--warn)}
.tools{display:flex;gap:8px;flex:none;padding-top:2px}
.icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--belly);color:var(--ink);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px;display:block}
.icon-btn.heart{color:var(--throat)}
.icon-btn:active{transform:scale(.92)}
.badge{position:absolute;top:-5px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--throat);color:var(--throat-ink);font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}
.wire{position:absolute;left:-16px;right:-16px;bottom:0;height:22px;pointer-events:none}
.wire svg{width:100%;height:100%;display:block}
.perch{position:absolute;right:24%;bottom:9px;width:34px;height:22px;pointer-events:none}
.perch svg{width:100%;height:100%;display:block}

/* ---------- 聊天 ---------- */
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-block:14px 8px;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:8px;align-items:flex-end;min-width:0}
.row.her{justify-content:flex-end}
.row.bot + .row.bot .av{visibility:hidden}
.av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--belly);border:1px solid var(--line);display:grid;place-items:center}
.av svg{width:22px;height:14px;display:block}
.bubble{max-width:78%;min-width:0;padding:8px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.bot .bubble{background:var(--belly);border:1px solid var(--line);border-bottom-left-radius:6px}
.her .bubble{background:var(--throat);color:var(--throat-ink);border-bottom-right-radius:6px}
.bubble.cut{opacity:.7}
.row.her + .row.bot,.row.bot + .row.her{margin-top:6px}
.typing{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;padding-left:38px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--ink-soft);animation:hop 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-4px);opacity:1}}

.stamp-row{align-self:center;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-soft);padding:6px 12px;border-radius:12px;background:var(--sky-hi);border:1px dashed var(--line);max-width:92%;margin-block:4px}
.stamp-row b{color:var(--ink);font-weight:600}
.seal-mini{flex:none;width:26px;height:26px;border-radius:5px;border:1.5px solid var(--throat);color:var(--throat);display:grid;place-items:center;font-family:var(--f-brush);font-size:16px;line-height:1;transform:rotate(-10deg)}
.stamp-row.in{animation:stampin .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes stampin{0%{transform:scale(1.5);opacity:0}100%{transform:none;opacity:1}}

.capsule{max-width:82%;min-width:0;border-radius:16px;border:1.5px solid var(--tc);background:var(--belly);overflow:hidden}
.capsule .cap-top{display:flex;align-items:baseline;gap:8px;padding:5px 12px;background:var(--tc);color:#fff;font-size:12px;letter-spacing:.06em}
.capsule .tier{font-family:var(--f-display);font-size:17px;letter-spacing:.08em}
.capsule .cap-text{padding:10px 13px;white-space:pre-wrap;overflow-wrap:anywhere}
.capsule .cap-bonus{padding:0 13px 10px;font-size:12.5px;color:var(--ink-soft)}
.t-N{--tc:var(--r-n)}.t-R{--tc:var(--r-r)}.t-SR{--tc:var(--r-sr)}.t-SSR{--tc:var(--r-ssr)}
.capsule.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.55) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}

/* ---------- 快捷按钮 & 输入 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:14px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--belly);color:var(--ink)}
.chip.gacha{border-color:var(--r-ssr);border-width:1.5px}
.chip:active{transform:scale(.95)}
.chip:disabled{opacity:.5}
form.composer{display:flex;gap:8px;padding-block:6px 12px}
.composer input{flex:1;min-width:0;font-size:16px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--belly);color:var(--ink)}
.composer input::placeholder{color:var(--ink-soft)}
.send{flex:none;font-family:var(--f-display);font-size:17px;padding:0 18px;min-height:44px;border:none;border-radius:999px;background:var(--throat);color:var(--throat-ink)}
.send:disabled{opacity:.5;cursor:default}

/* ---------- 飘心 & 飞燕 ---------- */
.float-heart{position:fixed;z-index:50;pointer-events:none;color:var(--throat);font-size:22px;line-height:1;animation:floatup .95s ease-out forwards}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--dx,0px)),-70px) scale(1.3);opacity:0}}
.flyer{position:fixed;left:0;top:0;width:72px;height:45px;z-index:60;pointer-events:none;animation:fly 1.5s cubic-bezier(.45,.05,.4,1) forwards}
.flyer svg{width:100%;height:100%;display:block;animation:flap .16s ease-in-out infinite alternate;transform-origin:50% 40%}
@keyframes fly{0%{transform:translate(-90px,72vh) rotate(-16deg) scale(.7)}55%{transform:translate(48vw,34vh) rotate(-8deg) scale(1)}100%{transform:translate(110vw,-12vh) rotate(-22deg) scale(.75)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.55)}}

/* ---------- 开场：航空信 ---------- */
.gate{position:fixed;inset:0;z-index:30;background:var(--sky);overflow-y:auto;display:flex;transition:opacity .45s ease;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.gate.leaving{opacity:0;pointer-events:none}
.scene{margin:auto;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.scene h2{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:32px;letter-spacing:.06em;text-wrap:balance}
.scene p{margin:0;color:var(--ink-soft);font-size:14.5px;text-wrap:balance}
.env{position:relative;width:min(300px,84vw);aspect-ratio:3/2;perspective:700px;margin-top:28px}
.env-body{position:absolute;inset:0;border-radius:12px;border:7px solid transparent;
  background:linear-gradient(var(--paper),var(--paper)) padding-box,
    repeating-linear-gradient(-45deg,var(--throat) 0 9px,var(--paper) 9px 14px,var(--air) 14px 23px,var(--paper) 23px 28px) border-box;
  box-shadow:0 12px 32px var(--shadow)}
.env-flap{position:absolute;left:7px;right:7px;top:7px;height:56%;background:var(--paper-2);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .6s cubic-bezier(.4,.1,.3,1);z-index:2}
.wax{position:absolute;left:50%;top:calc(7px + (100% - 14px) * .56);width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--throat);color:#fff;display:grid;place-items:center;
  font-family:var(--f-brush);font-size:28px;line-height:1;z-index:3;box-shadow:0 3px 8px var(--shadow),inset 0 0 0 3px rgba(255,255,255,.22);transition:transform .35s,opacity .35s}
.env-to{position:absolute;left:0;right:0;bottom:13%;font-family:var(--f-brush);font-size:23px;color:var(--ink);letter-spacing:.08em;z-index:1}
.gate.opening .env-flap{transform:rotateX(178deg)}
.gate.opening .wax{transform:scale(1.3);opacity:0}
.gate-form{display:flex;gap:8px;width:100%}
.gate-form input{flex:1;min-width:0;font-size:16px;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--belly);color:var(--ink);text-align:center}
.gate-msg{min-height:1.6em;color:var(--throat);font-size:14px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.scene-seal.fading{opacity:0;transition:opacity .3s}

.letter{position:relative;width:100%;background:var(--paper);border-radius:14px;padding:26px 22px 20px;text-align:left;box-shadow:0 12px 32px var(--shadow)}
.letter::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;border-radius:14px 14px 0 0;
  background:repeating-linear-gradient(90deg,var(--throat) 0 18px,var(--paper) 18px 24px,var(--air) 24px 42px,var(--paper) 42px 48px)}
.letter .to{font-family:var(--f-brush);font-size:28px;line-height:1.3;margin-bottom:6px}
.letter p{margin:0 0 6px;font-family:var(--f-letter);font-size:16.5px;line-height:1.95;text-indent:2em;color:var(--ink)}
.letter .sign{margin-top:12px;text-align:right;font-family:var(--f-brush);font-size:26px;line-height:1.2}
.letter .date{text-align:right;font-size:12.5px;color:var(--ink-soft);margin-top:2px}
.scene-letter.in .letter{animation:rise .65s cubic-bezier(.2,.8,.3,1) both}
.scene-letter.in .go{animation:rise .65s .25s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}

/* ---------- 底部弹层 ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.panel{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--sky-hi);border-radius:20px 20px 0 0;animation:up .28s ease-out;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.panel-head h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;letter-spacing:.04em}
.close{border:none;background:none;color:var(--ink-soft);font-size:15px;padding:6px 4px}
.primary{width:100%;min-height:46px;border:none;border-radius:14px;background:var(--throat);color:var(--throat-ink);font-family:var(--f-display);font-size:18px;letter-spacing:.04em;margin-top:14px}
.secondary{width:100%;min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--belly);color:var(--ink);font-size:15px;margin-top:10px}
.secondary.danger{color:var(--throat)}
.note{font-size:13px;color:var(--ink-soft);margin:8px 0 0}

/* 欠条 */
.iou{position:relative;background:var(--paper);border-radius:12px;padding:20px 18px 18px;box-shadow:0 6px 18px var(--shadow)}
.iou-title{text-align:center;font-family:var(--f-brush);font-size:34px;letter-spacing:.5em;padding-left:.5em;line-height:1.2;margin-bottom:8px}
.iou-lines{font-family:var(--f-letter);font-size:16px;line-height:34px;
  background-image:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px)}
.iou-lines ol{margin:0;padding-left:1.6em}
.iou-lines li{position:relative;padding-right:52px}
.paid{position:absolute;right:0;top:6px;height:22px;line-height:20px;font-size:12px;padding:0 8px;border-radius:11px;border:1px solid var(--line);background:var(--belly);color:var(--ink-soft);font-family:var(--f-body)}
.iou-empty{color:var(--ink-soft)}
.iou-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:14px;font-family:var(--f-letter);font-size:14px;line-height:1.6}
.iou-foot small{color:var(--ink-soft);font-family:var(--f-body);font-size:12px}
.seal-big{flex:none;width:58px;height:58px;border:2.5px solid var(--throat);border-radius:6px;color:var(--throat);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:center;
  font-family:var(--f-brush);font-size:20px;line-height:1;padding:3px;transform:rotate(-8deg);opacity:.9}
.seal-big span:nth-child(1){grid-area:1/2}.seal-big span:nth-child(2){grid-area:2/2}.seal-big span:nth-child(3){grid-area:1/1}.seal-big span:nth-child(4){grid-area:2/1}
.copy-out{width:100%;min-height:150px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--belly);color:var(--ink);padding:10px;font-size:14px}

/* 菜单 & 后台 */
.menu-list{display:flex;flex-direction:column;gap:10px}
.menu-list .secondary{margin-top:0}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13.5px;color:var(--ink-soft)}
.field input,.field select{font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--belly);color:var(--ink);width:100%;min-width:0}
.two{display:flex;gap:10px}
.two > *{flex:1;min-width:0}
.ad-state{font-size:13px;padding:8px 12px;border-radius:10px;background:var(--belly);border:1px solid var(--line);margin-bottom:12px}
.ad-out{font-size:14px;margin-top:10px;min-height:1.4em;overflow-wrap:anywhere}
.ad-out.good{color:var(--ok)}.ad-out.bad{color:var(--throat)}

@media (prefers-reduced-motion: reduce){
  .dots i,.shake,.capsule.pop,.stamp-row.in,.float-heart,.panel,.scene-letter.in .letter,.scene-letter.in .go{animation:none}
  .env-flap,.wax,.gate{transition:none}
  .chip:active,.icon-btn:active{transform:none}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="swallow" viewBox="0 0 64 40">
    <path fill="var(--ink)" d="M32 7c-2.6 0-4.6 2.3-4.9 5.2L3 5c5 9.6 13.4 15 23.6 16.2L28 29l-4.6 10 8.6-7.6 8.6 7.6L36 29l1.4-7.8C47.6 20 56 14.6 61 5l-24.1 7.2C36.6 9.3 34.6 7 32 7z"/>
    <ellipse cx="32" cy="15.2" rx="2.6" ry="2.3" fill="var(--throat)"/>
  </symbol>
  <symbol id="perched" viewBox="0 0 34 22">
    <path fill="var(--ink)" d="M8 8c0-3 2.4-5 5-5 2 0 3.4 1 4.2 2.6L31 15l-9 .4-4.4 4.6H11.5C9 20 7 18 7 15.4z"/>
    <path fill="var(--ink)" d="M22 15.4 33 21l-12.6-2z"/>
    <circle cx="10.6" cy="7" r="1" fill="var(--sky)"/>
    <path fill="var(--throat)" d="M7.4 10.6c.6 2 2 3 3.8 3.2-1.8.6-3.6.2-4.4-1.2z"/>
    <path fill="var(--belly)" d="M9 15.6c1.6 2.2 4 3 6.6 2.6L11.5 20C9.6 20 8.4 18 9 15.6z" opacity=".9"/>
  </symbol>
</svg>

<div class="app">
  <header>
    <div class="brand">
      <h1 id="title">小燕子专线</h1>
      <div class="status" id="status" data-mode="pending"><span class="dot"></span><span id="statusText">多多2号正在上线…</span></div>
    </div>
    <div class="tools">
      <button class="icon-btn heart" id="missBtn" type="button" aria-label="想多多">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span class="badge" id="missBadge" hidden>0</span>
      </button>
      <button class="icon-btn" id="debtBtn" type="button" aria-label="多多的欠条">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="badge" id="debtBadge" hidden>0</span>
      </button>
      <button class="icon-btn" id="menuBtn" type="button" aria-label="更多">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="wire" aria-hidden="true">
      <svg viewBox="0 0 400 22" preserveAspectRatio="none"><path d="M0 4 Q200 26 400 4" fill="none" stroke="var(--wire)" stroke-width="1.2" vector-effect="non-scaling-stroke"/></svg>
    </div>
    <div class="perch" aria-hidden="true"><svg><use href="#perched"/></svg></div>
  </header>

  <main id="msgs" aria-live="polite"></main>

  } catch (e) {}

function convo(){
  const out = [];
  for (const m of S.log.slice(-30)){
    if (m.who === "her") out.push({ role: "user", content: m.text });
    else if (m.who === "bot") out.push({ role: "assistant", content: m.text });
    else if (m.who === "stamp" && out.length && out[out.length - 1].role === "assistant") out[out.length - 1].content += "\n【欠条】" + m.text;
  }
  const merged = [];
  for (const m of out){
    const last = merged[merged.length - 1];
    if (last && last.role === m.role) last.content += "\n" + m.content;
    else merged.push({ role: m.role, content: m.content });
  }
  if (merged.length && merged[0].role === "assistant") merged.unshift({ role: "user", content: "（小燕子打开了专线）" });
  return merged;
}

/* ---------- AI 调用 ---------- */
function sseDelta(line){
  if (!line || line.indexOf("data:") !== 0) return null;
  const data = line.slice(5).trim();
  if (data === "[DONE]") return "[DONE]";
  try {
    const j = JSON.parse(data); const c = j.choices && j.choices[0]; const d = c && (c.delta || c.message);
    return d && typeof d.content === "string" && d.content ? d.content : null;
  } catch (e) { return null; }
}
function extractAll(txt){
  try { const j = JSON.parse(txt); const c = j.choices && j.choices[0]; if (c && c.message) return c.message.content || ""; } catch (e) {}
  let out = "";
  for (const line of String(txt).split("\n")){ const p = sseDelta(line.trim()); if (p && p !== "[DONE]") out += p; }
  return out;
}
async function readStream(res, onText, signal){
  let full = "";
  const ct = (res.headers.get("content-type") || "").toLowerCase();
  try {
    if (!res.body || typeof res.body.getReader !== "function" || (ct.indexOf("json") >= 0 && ct.indexOf("stream") < 0)){
      full = extractAll(await res.text());
      if (full) onText(full);
      return full;
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;){
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0){
        const piece = sseDelta(buf.slice(0, nl).trim()); buf = buf.slice(nl + 1);
        if (piece === null) continue;
        if (piece === "[DONE]") return full;
        full += piece; onText(full);
      }
    }
    const tail = sseDelta(buf.trim());
    if (tail && tail !== "[DONE]"){ full += tail; onText(full); }
    return full;
  } catch (e) {
    if (signal && signal.aborted) throw { code: "cancelled", text: full };
    throw { code: "network", message: String((e && e.message) || e), text: full };
  }
}
async function askAPIWith(cfg, messages, onText, signal){
  const base = String(cfg.b || DEFAULT_BASE).trim().replace(/\/+$/, "");
  const url = /\/chat\/completions$/.test(base) ? base : base + "/chat/completions";
  const models = [cfg.m || DEFAULT_MODEL];
  if (/deepseek\.com/i.test(base)) ["deepseek-flash", "deepseek-chat"].forEach(m => { if (models.indexOf(m) < 0) models.push(m); });
  let lastErr = null;
  for (let i = 0; i < models.length; i++){
    let res;
    try {
      res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.k },
        body: JSON.stringify({ model: models[i], messages, stream: true, temperature: 1.3, max_tokens: 1000 }),
        signal
      });
    } catch (e) {
      if (signal && signal.aborted) throw { code: "cancelled" };
      throw { code: "network", message: String((e && e.message) || e) };
    }
    if (!res.ok){
      let body = ""; try { body = await res.text(); } catch (e) {}
      lastErr = { code: "http", status: res.status, message: body.slice(0, 240) };
      if ((res.status === 400 || res.status === 404 || res.status === 422) && /model/i.test(body) && i < models.length - 1) continue;
      throw lastErr;
    }
    cfg.m = models[i];
    return readStream(res, onText, signal);
  }
  throw lastErr || { code: "http", status: 0, message: "" };
}

function explain(e){
  if (!e) return "出错了。";
  if (e.code === "network") return inClaude ? "在 Claude 预览里网页连不了外网，这里测不了。部署到你的网站后再点测试。" : "连不上 AI：可能是网络问题，也可能这家服务商不让网页直接调用。把这句话截图发给 Claude。";
  if (e.status === 401) return "API Key 不对，检查一下有没有复制全。";
  if (e.status === 402) return "DeepSeek 余额不足，去开放平台充一点。";
  if (e.status === 429) return "请求太频繁，或者额度用完了，等一会儿再试。";
  if (e.status) return "AI 那边报错（" + e.status + "）：" + (e.message || "").slice(0, 120);
  return "出错了：" + (e.message || e.code || "未知原因");
}

/* ---------- 一条回复的流式渲染（可拆成几条气泡） ---------- */
function streamer(){
  let typing = showTyping(), rows = [], last = "";
  const dropTyping = () => { if (typing){ typing.remove(); typing = null; } };
  function paint(full, streaming){
    const parts = parseReply(full, streaming).parts;
    if (!parts.length) return parts;
    dropTyping();
    parts.forEach((p, i) => { if (!rows[i]) rows[i] = addBubble("bot", ""); rows[i].bubble.textContent = p; });
    while (rows.length > parts.length) rows.pop().row.remove();
    scrollDown();
    return parts;
  }
  return {
    update(t){ last = t; paint(t, true); },
    has(){ return parseReply(last, false).parts.length > 0; },
    text(){ return last; },
    finish(full, cut){
      last = full;
      const parts = paint(full, false);
      dropTyping();
      if (!parts.length) return false;
      if (cut) rows.forEach(r => r.bubble.classList.add("cut"));
      S.log.push({ who: "bot", text: parts.join("\n"), at: Date.now() }); saveLog(); store.set("yz.seen", Date.now());
      parseReply(full, false).debts.forEach(d => setTimeout(() => addDebt(d), 300));
      return true;
    },
    clear(){ dropTyping(); rows.forEach(r => r.row.remove()); rows = []; }
  };
}

function localReply(text){
  if (CRISIS.test(text)) return CRISIS_REPLY;
  for (const [re, pool] of RULES){
    if (re.test(text)){
      if (pool === "tuwei") return pick("tuwei");
      const base = pick(pool);
      if (pool !== "comfort" && pool !== "who" && pool !== "debt" && Math.random() < 0.3) return base + "\n" + pick("tuwei");
      return base;
    }
  }
  return Math.random() < 0.4 ? pick("tuwei") : pick("chatter");
}
async function send(raw){
  const text = String(raw || "").trim().slice(0, 500);
  if (!text || S.busy) return;
  box.value = "";
  const mine = { who: "her", text }; pushLog(mine); renderItem(mine, true);
  if (/想多多|想他|好想你/.test(text)) bumpMiss(true);
  setBusy(true, false);
  const st = streamer();
  try {
    if (CRISIS.test(text)){ await wait(600); st.clear(); botSay(CRISIS_REPLY); return; }
    let m = mode();
    if (m === "pending"){ await samplePromise; m = mode(); }
    if (m === "api" || m === "claude"){
      S.ctl = new AbortController();
      setBusy(true, true);
      try {
        const onText = t => st.update(t);
        const out = m === "api"
          ? await askAPIWith(S.cfg, [{ role: "system", content: persona() }].concat(convo()), onText, S.ctl.signal)
          : await askClaude([{ role: "user", content: persona() }].concat(convo()), onText, S.ctl.signal);
        if (st.finish(out, false)){ if (m === "api") S.apiFails = 0; return; }
        st.clear();
      } catch (e) {
        if (e && e.code === "cancelled"){
          const partial = e.text || st.text();
          if (partial && parseReply(partial, false).parts.length) st.finish(partial, true); else st.clear();
          return;
        }
        noteFailure(m, e);
        const partial = (e && e.text) || st.text();
        if (partial && parseReply(partial, false).parts.length && !(e && e.code === "refused")){ st.finish(partial, true); return; }
        st.clear();
      }
    }
    await wait(450 + Math.random() * 650);
    st.clear();
    localAnswer(text);
  } finally {
    S.ctl = null;
    setBusy(false);
  }
}
$("#composer").addEventListener("submit", e => {
  e.preventDefault();
  if (S.busy && S.ctl){ S.ctl.abort(); return; }
  send(box.value);
});
const chips = $("#chips");
CHIPS.forEach(([label, msg]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (msg ? "" : " gacha"); b.textContent = label;
  b.addEventListener("click", () => msg ? send(msg) : gacha());
  chips.append(b);
});

/* ---------- 顶栏按钮 & 弹层 ---------- */
function openSheet(el){ el.hidden = false; }
function closeSheet(el){ el.hidden = true; }
document.querySelectorAll(".sheet").forEach(sh => {
  sh.addEventListener("click", e => { if (e.target === sh || (e.target.closest && e.target.closest("[data-close]"))) closeSheet(sh); });
});
$("#missBtn").addEventListener("click", e => { floatHeart(e.currentTarget); bumpMiss(false); });
$("#debtBtn").addEventListener("click", () => { renderIou(); openSheet($("#debtSheet")); });
$("#menuBtn").addEventListener("click", () => { armClear(false); openSheet($("#menuSheet")); });
$("#copyIou").addEventListener("click", async () => {
  const t = iouText();
  if (await copyText(t)){ $("#copyNote").textContent = "复制好了，去微信粘贴给多多吧。"; $("#copyOut").hidden = true; }
  else { const ta = $("#copyOut"); ta.value = t; ta.hidden = false; $("#copyNote").textContent = "这里没法自动复制，长按下面的文字全选复制。"; }
});
$("#mLetter").addEventListener("click", () => { closeSheet($("#menuSheet")); showLetter(true); });
let clearArmed = false, clearTimer = null;
function armClear(on){
  clearArmed = on; clearTimeout(clearTimer);
  $("#mClear").textContent = on ? "再点一下，确认清空" : "清空聊天记录";
  if (on) clearTimer = setTimeout(() => armClear(false), 3000);
}
$("#mClear").addEventListener("click", () => {
  if (S.busy) return;
  if (!clearArmed){ armClear(true); return; }
  armClear(false);
  S.log = []; saveLog(); greet(); renderAll();
  closeSheet($("#menuSheet"));
});
let taps = [], tapsTimer = null;
$("#title").addEventListener("click", () => {
  const t = Date.now(); taps = taps.filter(x => t - x < 2500); taps.push(t);
  if (taps.length >= 5){ taps = []; openAdmin(); }
});

/* ---------- 多多后台 ---------- */
let madeLink = "";
function adMsg(text, kind){ const o = $("#adOut"); o.textContent = text; o.className = "ad-out" + (kind ? " " + kind : ""); }
function readAdmin(){ return { b: $("#adBase").value.trim() || DEFAULT_BASE, m: $("#adModel").value.trim() || DEFAULT_MODEL, k: $("#adKey").value.trim() }; }
function openAdmin(){
  $("#adState").textContent = S.cfg
    ? "本机已接入 AI（" + S.cfg.m + "）" + (S.apiBroken ? "，但刚才连不上：" + S.lastApiErr : "")
    : (inClaude ? "现在是 Claude 预览，聊天用的是 Claude。她那边要用下面的方式接 AI。" : "本机还没接入 AI，目前是存货模式。");
  $("#adProv").value = (S.cfg && !/deepseek\.com/i.test(S.cfg.b)) ? "custom" : "deepseek";
  $("#adBase").value = S.cfg ? S.cfg.b : DEFAULT_BASE;
  $("#adModel").value = S.cfg ? S.cfg.m : DEFAULT_MODEL;
  $("#adKey").value = ""; $("#adPw").value = "";
  $("#adSite").value = inClaude ? "" : String(location.href).split("#")[0];
  $("#adLink").hidden = true; $("#adCopy").hidden = true; madeLink = "";
  adMsg("", "");
  openSheet($("#adminSheet"));
}
$("#adProv").addEventListener("change", e => {
  if (e.target.value === "deepseek"){ $("#adBase").value = DEFAULT_BASE; $("#adModel").value = DEFAULT_MODEL; }
  else { $("#adBase").value = ""; $("#adModel").value = ""; $("#adBase").focus(); }
});
$("#adTest").addEventListener("click", async () => {
  const cfg = readAdmin();
  if (!cfg.k){ adMsg("先填 API Key。", "bad"); return; }
  if (inClaude){ adMsg(explain({ code: "network" }), "bad"); return; }
  adMsg("测试中…", "");
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 45000);
    const out = await askAPIWith(cfg, [{ role: "user", content: "只回复两个字：通了" }], () => {}, ctl.signal);
    clearTimeout(timer);
    $("#adModel").value = cfg.m;
    adMsg("通了！AI 回复：" + String(out).trim().slice(0, 40) + "（模型 " + cfg.m + "）", "good");
  } catch (e) {
    adMsg(e && e.code === "cancelled" ? "等太久没回应，检查一下网络或接口地址。" : explain(e), "bad");
  }
});
$("#adMake").addEventListener("click", async () => {
  const cfg = readAdmin(), pw = norm($("#adPw").value), site = $("#adSite").value.trim().split("#")[0];
  if (!passOK(pw)){ adMsg("暗号不对，要填她的全名。", "bad"); return; }
  if (!cfg.k){ adMsg("先填 API Key。", "bad"); return; }
  if (!/^https?:\/\/\S+$/i.test(site)){ adMsg("填一下部署后的网站地址（https:// 开头）。", "bad"); return; }
  if (!(window.crypto && crypto.subtle)){ adMsg("这个浏览器不支持加密，换个浏览器打开后台。", "bad"); return; }
  try {
    const blob = await seal(cfg, pw);
    madeLink = site + "#c=" + blob;
    const ta = $("#adLink"); ta.value = madeLink; ta.hidden = false; $("#adCopy").hidden = false;
    store.set("yz.blob", blob); S.blob = blob;
    if (!inClaude){ S.cfg = cfg; S.apiBroken = false; S.apiFails = 0; setMode(); }
    adMsg("专属链接生成好了。复制后发到微信给她，她用暗号拆信就能用 AI 聊天。", "good");
  } catch (e) { adMsg("生成失败：" + ((e && e.message) || e), "bad"); }
});
$("#adCopy").addEventListener("click", async () => {
  if (!madeLink) return;
  if (await copyText(madeLink)) adMsg("复制好了，去微信发给她吧。", "good");
  else { $("#adLink").select(); adMsg("没法自动复制，长按上面的链接全选复制。", "bad"); }
});
$("#adForget").addEventListener("click", () => {
  store.del("yz.blob"); S.blob = BAKED; S.cfg = null; S.apiBroken = false; setMode();
  $("#adState").textContent = "本机已断开 AI。"; adMsg("", "");
});

/* ---------- 开场：拆信 ---------- */
const gate = $("#gate"), sceneSeal = $("#sceneSeal"), sceneLetter = $("#sceneLetter");
let wrongIdx = 0, letterReturn = false;
function fillLetter(){
  const body = $("#letterBody"); body.innerHTML = "";
  CONFIG.letter.forEach(t => { const p = document.createElement("p"); p.textContent = t; body.append(p); });
  $("#letterDate").textContent = CONFIG.letterDate;
}
function openGate(){
  gate.classList.remove("opening", "leaving");
  sceneSeal.classList.remove("fading"); sceneSeal.hidden = false;
  sceneLetter.hidden = true; sceneLetter.classList.remove("in");
  gate.hidden = false;
}
function showLetter(fromMenu){
  letterReturn = !!fromMenu;
  $("#letterGo").textContent = fromMenu ? "回到专线" : "接通专线";
  gate.classList.remove("leaving");
  sceneSeal.hidden = true;
  sceneLetter.hidden = false; sceneLetter.classList.remove("in"); void sceneLetter.offsetWidth; sceneLetter.classList.add("in");
  gate.hidden = false; gate.scrollTop = 0;
}
function flight(){
  if (reduced) return;
  const el = document.createElement("div");
  el.className = "flyer";
  el.innerHTML = '<svg viewBox="0 0 64 40" aria-hidden="true"><use href="#swallow"/></svg>';
  document.body.append(el); setTimeout(() => el.remove(), 1600);
}
$("#letterGo").addEventListener("click", () => {
  gate.classList.add("leaving");
  if (!letterReturn) flight();
  setTimeout(() => { gate.hidden = true; gate.classList.remove("leaving"); }, reduced ? 0 : 450);
});
$("#gateForm").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#gateBox"), msg = $("#gateMsg"), v = norm(input.value);
  if (!v) return;
  if (v === "多多后台"){ input.value = ""; msg.textContent = ""; openAdmin(); return; }
  if (passOK(v)){
    input.blur(); msg.textContent = "收信人确认，正在拆信…";
    unlock(v);
    gate.classList.add("opening");
    const t1 = reduced ? 0 : 700, t2 = reduced ? 0 : 300;
    setTimeout(() => { sceneSeal.classList.add("fading"); setTimeout(() => { msg.textContent = ""; input.value = ""; showLetter(false); }, t2); }, t1);
    return;
  }
  msg.textContent = v === "小燕子" ? "这是小名哦，邮局只认全名。"
    : (v === "多多" || v === "卢宏瑞") ? "那是寄件人的名字啦，要写收信人，也就是你。"
    : WRONG[wrongIdx++ % WRONG.length];
  const sc = sceneSeal; sc.classList.remove("shake"); void sc.offsetWidth; sc.classList.add("shake");
});

/* ---------- 解锁 & AI 配置 ---------- */
function readHashBlob(){
  try { const m = String(location.hash || "").match(/[#&]c=([A-Za-z0-9_-]{40,})/); return m ? m[1] : ""; } catch (e) { return ""; }
}
async function loadCfg(pw){
  if (!S.blob || !(window.crypto && crypto.subtle)) return;
  try {
    const cfg = await unseal(S.blob, pw);
    if (cfg && cfg.k){ S.cfg = { b: cfg.b || DEFAULT_BASE, m: cfg.m || DEFAULT_MODEL, k: cfg.k }; S.apiBroken = false; }
  } catch (e) { /* 链接里的配置和暗号对不上，就用存货模式 */ }
  setMode();
}
function unlock(pw){
  S.pw = norm(pw); store.set("yz.pw", S.pw);
  loadCfg(S.pw);
}

/* ---------- 开场白 ---------- */
function greet(){
  if (S.log.length) return;
  S.log.push({ who: "bot", text: "小燕子！专线接通啦～\n我是多多2号，多多的 AI 分身。他不在的时候我值班：陪你聊天、逗你、帮你记多多的欠条。\n想他了就点右上角的小心心，点一下算一次。", at: Date.now() });
  saveLog();
}
function welcomeBack(){
  const seen = store.get("yz.seen", 0);
  if (!seen || Date.now() - seen < 3 * 3600 * 1000) return;
  const h = nowInfo().hour;
  const line = h < 5 ? "这么晚还来专线？是想多多了还是睡不着？说完快睡，熬夜的小燕子会被多多念叨。"
    : h < 10 ? "早呀小燕子！新的一天，也是被多多想念的一天。"
    : h < 14 ? "中午好～小燕子吃饭了没？没吃的话多多2号要开始唠叨了。"
    : h < 18 ? "下午好小燕子，犯困了吗？来，跟多多2号聊两句提提神。"
    : h < 23 ? "晚上好小燕子，今天过得怎么样？好的坏的都可以跟我说。"
    : "快十二点了还不睡？行吧，陪你聊会儿，就一会儿。";
  botSay(line);
}

/* ---------- 启动 ---------- */
const hb = readHashBlob();
if (hb) store.set("yz.blob", hb);
S.blob = hb || store.get("yz.blob", "") || BAKED;
fillLetter();
greet();
renderAll();
updateBadges();
setMode();
if (passOK(S.pw)){ loadCfg(S.pw); welcomeBack(); }
else { S.pw = ""; openGate(); }
store.set("yz.seen", Date.now());
})();
</script>
